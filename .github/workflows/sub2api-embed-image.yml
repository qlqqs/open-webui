# sub2api-embed: publish only the custom branch, after the focused regression gates.
name: Custom Image

on:
  push:
    branches: [sub2api-custom]
  workflow_dispatch:

concurrency:
  group: sub2api-embed-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    if: github.repository == 'qlqqs/open-webui' && github.ref == 'refs/heads/sub2api-custom'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-slim.txt
      - name: Install slim and test dependencies (no models)
        run: python -m pip install -r backend/requirements-slim.txt pypdf==6.7.5 docx2txt==0.9 pytest pytest-asyncio
      - name: Embed backend regression (includes local fake-gateway smoke)
        # Smoke copies FRONTEND_BUILD_DIR/static into its isolated STATIC_DIR.
        # A clean checkout has no build/ yet; use the checked-in static fixtures.
        env:
          FRONTEND_BUILD_DIR: ${{ github.workspace }}
        run: python -m pytest -q backend/open_webui/test/embed

  frontend-test:
    if: github.repository == 'qlqqs/open-webui' && github.ref == 'refs/heads/sub2api-custom'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run crypto:verify
      - run: node scripts/embed-codemod.mjs --check
      - run: npm run test:embed

  image:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve immutable tag
        id: meta
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sub2api-embed.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qlqqs/open-webui:custom-latest
            ghcr.io/qlqqs/open-webui:custom-${{ steps.meta.outputs.short_sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Open-WebUI
          cache-from: type=gha,scope=sub2api-embed
          cache-to: type=gha,scope=sub2api-embed,mode=max
